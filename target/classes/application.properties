# Server Configuration
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/fraud-detection
spring.data.mongodb.database=fraud-detection

# Fraud Detection Rules
fraud.rules.amount.threshold=10000
fraud.rules.location.enabled=true
fraud.rules.location.radius=50

# Feature Toggles
feature.toggles.advanced-fraud-detection.enabled=false
feature.toggles.admin-ui.enabled=false

# Logging Configuration
logging.level.com.creditcard.frauddetector=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
